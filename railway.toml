[build]
  builder = "DOCKERFILE"
  dockerfilePath = "Dockerfile"

[deploy]
  # db push, а не migrate deploy: истории миграций ещё нет
  preDeployCommand = "npx prisma db push && npm run db:seed"
  startCommand = "npm run start"
  healthcheckPath = "/api/health"
  healthcheckTimeout = 300
  restartPolicyType = "ON_FAILURE"
